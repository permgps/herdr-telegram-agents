# Builds and publishes a release for every v* tag. The manifest version must
# equal the tag (scripts/check-version.sh), because the install scripts read
# it from herdr-plugin.toml to pick the asset to download.
#
# This job holds a token that can write releases, so every action is pinned
# to a commit (a tag can be moved to other code), goreleaser to an exact
# version, the Go cache is off, and the module files are checked, not
# rewritten, before the build. Dependabot proposes pin updates.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Module files are tidy
        run: go mod tidy -diff
      - name: Manifest version matches the tag
        run: sh scripts/check-version.sh "$GITHUB_REF_NAME"
      - name: go test
        run: go test ./...
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          version: v2.18.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
