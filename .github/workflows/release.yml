# Builds and publishes a release for every v* tag. The manifest version must
# equal the tag (scripts/check-version.sh), because the install scripts read
# it from herdr-plugin.toml to pick the asset to download.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Manifest version matches the tag
        run: sh scripts/check-version.sh "$GITHUB_REF_NAME"
      - name: go test
        run: go test ./...
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
