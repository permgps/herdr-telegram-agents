# Lint and tests for every branch push and every pull request.
# The shell gates (import layering, cross-compile) are POSIX sh, so they run
# only in the ubuntu lint job; Windows runs the unit tests without -race
# because the race detector needs a C toolchain there.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@2026.1
      - name: make lint
        run: make lint

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: go test -race
        run: go test -race ./...

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # A failure is also reported as an annotation so the reason is visible
      # without downloading the log (nobody develops this on Windows).
      - name: go test
        shell: pwsh
        run: |
          go test ./... *> test-output.txt
          $code = $LASTEXITCODE
          Get-Content test-output.txt | Write-Host
          if ($code -ne 0) {
            $lines = Get-Content test-output.txt | Where-Object { $_ -notmatch '^go: downloading' }
            $tail = (($lines | Select-Object -Last 80) -join "%0A")
            Write-Host "::error title=windows tests::$tail"
          }
          exit $code
