# Telegram Agents: mirrors the Herdr Agents panel into a Telegram forum group.
# Every entrypoint runs the single binary bin/herdr-tg with a subcommand.
# Action ids must be unique across the manifest (Herdr rejects a per-platform
# duplicate with duplicate_plugin_action_id), so one entry serves all
# platforms: on Windows the process launcher resolves bin/herdr-tg to
# bin/herdr-tg.exe. [[build]] entries arrive with the distribution milestone;
# until then `make build` produces the binary before `herdr plugin link`.

id = "permgps.telegram-agents"
name = "Telegram Agents"
version = "0.1.0"
min_herdr_version = "0.7.5"
description = "One Telegram forum topic per live Herdr agent: status in the topic name and icon, messages both ways."
platforms = ["linux", "macos", "windows"]

# Runs once after session restore: starts the daemon when configured,
# otherwise shows a notification pointing at the setup action.
[[startup]]
command = ["bin/herdr-tg", "startup"]

[[actions]]
id = "setup"
title = "Telegram Agents: setup"
command = ["bin/herdr-tg", "action", "setup"]

[[actions]]
id = "start"
title = "Telegram Agents: start"
command = ["bin/herdr-tg", "action", "start"]

[[actions]]
id = "stop"
title = "Telegram Agents: stop"
command = ["bin/herdr-tg", "action", "stop"]

[[actions]]
id = "restart"
title = "Telegram Agents: restart"
command = ["bin/herdr-tg", "action", "restart"]

[[actions]]
id = "status"
title = "Telegram Agents: status"
command = ["bin/herdr-tg", "action", "status"]

[[actions]]
id = "resync"
title = "Telegram Agents: resync"
command = ["bin/herdr-tg", "action", "resync"]

[[actions]]
id = "logs"
title = "Telegram Agents: logs"
command = ["bin/herdr-tg", "action", "logs"]

# Interactive setup wizard; opened by the setup action through
# `herdr plugin pane open --plugin permgps.telegram-agents --entrypoint setup`.
# Pane commands are looked up in PATH rather than the plugin directory
# (Herdr 0.7.5), so the action passes --env PATH=<plugin root>:$PATH.
[[panes]]
id = "setup"
title = "Telegram Agents setup"
placement = "popup"
width = "80%"
height = "70%"
command = ["bin/herdr-tg", "setup-pane"]

# Tail of daemon.log; opened by the logs action.
[[panes]]
id = "logs"
title = "Telegram Agents logs"
placement = "overlay"
command = ["bin/herdr-tg", "logs-pane"]
